name: Sync design-system release

# A library release lands here as a PR (decisions/0001, item 3). The library's
# release.yml sends a `design-system-released` dispatch (payload: { version })
# after it publishes. This bumps @amezquita/design-system to that exact
# version, runs the gate, and opens a PR, or files an issue if the gate fails.
# Merging stays a manual click. Never pushes to main.
#
# Modelled on the portfolio's sync-design-system.yml, which has worked end to
# end since 2026-10-05. Differences: nothing generated is committed here (the
# build copies the agent files from the package into gitignored paths), so
# the PR is the version bump alone, and the gate is the site's own checks.
#
# The gate: typecheck and build, as 0001 says, plus check:themes, the browser
# check that both brands stay in their panels on /themes. The build runs
# check-workarounds.mjs, whose warnings go into the PR body: they say which
# workaround the new release makes unnecessary.
#
# Requires the amez-ds-self-heal GitHub App installed on this repo (Contents,
# Pull requests and Issues write) and this repo's own SELF_HEAL_APP_CLIENT_ID
# and SELF_HEAL_APP_PRIVATE_KEY secrets. A repository_dispatch only runs
# workflows on the default branch, so this does nothing until it's on main.

on:
  repository_dispatch:
    types: [design-system-released]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version }}
    steps:
      # An App token, not GITHUB_TOKEN: GitHub doesn't run checks or deploy
      # previews for a PR opened with GITHUB_TOKEN.
      - name: Mint a GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SELF_HEAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.SELF_HEAL_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The dispatch arrives seconds after the publish, and npm can take a
      # minute or two to serve the new version: 1.3.1's first sync failed
      # with ETARGET. Wait for it, then install without npm's cached metadata.
      - name: Wait for the version on npm
        id: published
        continue-on-error: true
        run: |
          for i in $(seq 1 20); do
            if npm view "@amezquita/design-system@$VERSION" version --prefer-online > /dev/null 2>&1; then
              echo "On npm after $(( (i - 1) * 15 ))s"
              exit 0
            fi
            sleep 15
          done
          echo "::error::@amezquita/design-system@$VERSION isn't on npm after 5 minutes"
          exit 1

      - name: Bump @amezquita/design-system
        id: bump
        if: steps.published.outcome == 'success'
        continue-on-error: true
        run: npm install "@amezquita/design-system@$VERSION" --save-exact --prefer-online

      # Each gate is its own step so a failure names itself in the issue.
      # continue-on-error keeps the job going to the PR-or-issue branch below.
      - name: Typecheck
        id: typecheck
        if: steps.bump.outcome == 'success'
        continue-on-error: true
        run: npx tsc --noEmit

      - name: Build
        id: build
        if: steps.typecheck.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Install Chromium for check:themes
        if: steps.build.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Check the Themes page
        id: themes
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: npm run check:themes

      - name: Sum up the gate
        id: gate
        run: |
          failed=""
          [ "${{ steps.published.outcome }}" = "success" ] || failed="waiting for npm"
          [ -z "$failed" ] && [ "${{ steps.bump.outcome }}" != "success" ] && failed="the install"
          [ -z "$failed" ] && [ "${{ steps.typecheck.outcome }}" != "success" ] && failed="typecheck"
          [ -z "$failed" ] && [ "${{ steps.build.outcome }}" != "success" ] && failed="build"
          [ -z "$failed" ] && [ "${{ steps.themes.outcome }}" != "success" ] && failed="check:themes"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          {
            echo 'workarounds<<NOTES_EOF'
            grep -o 'Workaround no longer needed.*' build.log 2>/dev/null | sed 's/^/- /' || true
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # The action does nothing when there's nothing to commit, e.g. a
      # dispatch for the version already installed.
      - name: Open the version-bump PR
        if: steps.gate.outputs.failed == ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/design-system-sync/${{ env.VERSION }}
          base: main
          delete-branch: true
          add-paths: |
            package.json
            package-lock.json
          commit-message: 'chore(deps): @amezquita/design-system ${{ env.VERSION }}'
          title: 'chore(deps): @amezquita/design-system ${{ env.VERSION }}'
          body: |
            The library published `${{ env.VERSION }}`. This bumps the pinned version. The gate passed against it: typecheck, build (which copies the new agent files from the package) and `check:themes`.

            **Workarounds the release makes unnecessary** (from `check-workarounds.mjs`):
            ${{ steps.gate.outputs.workarounds || '- none' }}

            Read the release's entry in `node_modules/@amezquita/design-system/CHANGELOG.md` for anything the site should start using, check the Vercel preview, then merge or close. Opened by `.github/workflows/sync-design-system.yml`.

      - name: File an issue if the gate failed
        if: steps.gate.outputs.failed != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          FAILED: ${{ steps.gate.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create \
            --title "design-system $VERSION: sync failed at $FAILED" \
            --body "The library published \`$VERSION\`. Bumping to it here and running the gate failed at **$FAILED**. Most likely the release renamed or removed something a page or script here uses. Run: $RUN_URL. Bump by hand on a branch, fix what broke, and merge that instead."
